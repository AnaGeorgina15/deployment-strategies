services:
  blue:
    image: nginx:alpine
    volumes:
      - ./app/blue.html:/usr/share/nginx/html/index.html:ro
    networks: [internal]
  green:
    image: nginx:alpine
    volumes:
      - ./app/green.html:/usr/share/nginx/html/index.html:ro
    networks: [internal]
  proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [blue, green]
    networks: [internal]
networks:
  internal:
