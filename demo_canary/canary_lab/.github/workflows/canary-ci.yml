      - name: Promote and rollback
        run: |
          ./scripts/promote.sh green

          echo "Verificando que Green responda..."
          for i in $(seq 1 15); do
            response=$(curl -fsS http://127.0.0.1:8080/api/info) || true
            echo "Intento $i: $response"

            if echo "$response" | grep -q '"version":"v2"'; then
              echo "Green activada correctamente"
              break
            fi

            if [ "$i" -eq 15 ]; then
              echo "Error: Green no respondió correctamente"
              exit 1
            fi

            sleep 2
          done

          ./scripts/promote.sh blue

          echo "Verificando rollback hacia Blue..."
          for i in $(seq 1 15); do
            response=$(curl -fsS http://127.0.0.1:8080/api/info) || true
            echo "Intento $i: $response"

            if echo "$response" | grep -q '"version":"v1"'; then
              echo "Rollback realizado correctamente"
              exit 0
            fi

            sleep 2
          done

          echo "Error: el rollback no se verificó"
          exit 1
